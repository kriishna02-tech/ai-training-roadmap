[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-second-brain"
version = "1.0.0"
description = "Durable multimodal Telegram ingestion and citation-based personal memory retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx[socks]>=0.28,<1", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.20,<1", "qdrant-client>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.setuptools.package-data]
brain = ["*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
