[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-rate-limiter"
version = "1.0.0"
description = "Atomic Redis token buckets with a FastAPI gateway and observability"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "redis>=5.2,<8",
  "pydantic-settings>=2.6,<3", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "fakeredis[lua]>=2.26,<3", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["limiter*"]

[tool.setuptools.package-data]
limiter = ["*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
