name: Resume project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ai-second-brain, distributed-rate-limiter]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --all-extras --frozen
        working-directory: resume-projects/${{ matrix.project }}
      - run: uv run --frozen ruff check .
        working-directory: resume-projects/${{ matrix.project }}
      - run: uv run --frozen pytest -q
        working-directory: resume-projects/${{ matrix.project }}
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
  washbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: resume-projects/washbook/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: resume-projects/washbook
      - run: npm test
        working-directory: resume-projects/washbook
      - run: npm run test:full-emulator
        working-directory: resume-projects/washbook
      - run: npm run build
        working-directory: resume-projects/washbook
